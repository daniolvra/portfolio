<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dani's Portfolio — Daniele Oliveira</title>
<meta name="description" content="Portfólio 3D de Daniele Oliveira, designer gráfico em Belo Horizonte.">
<link rel="icon" href="68608591e07da4050de9be01f4ba5a1c.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&amp;family=Instrument+Serif:ital@0;1&amp;family=Parisienne&amp;display=swap" media="print" onload="this.media=\'all\'">
<style>
body{margin:0}
a{color:#5e3a91}a:hover{color:#302936}
.ui{pointer-events:auto}
.btn{transition:background .2s,color .2s}
.btn:hover{background:#302936;color:#f4f1e8}
.btn:focus-visible,.icon:focus-visible,.navb:focus-visible{outline:2px solid #7b4bb0;outline-offset:2px}
.icon:hover:not(:disabled){background:#fff}
.icon:disabled{opacity:.4;cursor:default}
.navb:hover{background:rgba(255,255,255,.55)}
.sr{position:absolute;left:16px;top:64px;z-index:45;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.sr:focus-within{width:auto;height:auto;overflow:visible;clip-path:none;background:#f4f1e8;padding:10px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-wrap:wrap;gap:6px;max-width:440px}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}}
@media (pointer: coarse){section[role=dialog]{max-height:88dvh !important}}
@media (max-width:640px){.hide-sm{display:none !important}.title-xl{font-size:44px !important}.lk-zoom{bottom:auto !important;top:52px !important;right:10px !important}.lk-bottom{left:10px !important;right:10px !important}}
@media (pointer: coarse){@supports (height: 100dvh){.lk-main{height:100dvh !important}}.lk-bottom{bottom:calc(18px + env(safe-area-inset-bottom)) !important}}
@media (pointer: coarse){.lk-main canvas{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
</style>
<script src="3d85bd170c46de5b515e30c31959843d.js"></script>
</head>
<body>
<script>
window.addEventListener('error', function (e) { if (!(e instanceof ErrorEvent) && !(e.target && e.target.tagName === 'SCRIPT')) return; var b = document.getElementById('dc-err'); if (!b) { b = document.createElement('pre'); b.id = 'dc-err'; b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:999;max-height:40vh;overflow:auto;margin:0;padding:10px;background:#fff3f3;color:#8a2b2b;border:1px solid #d99;border-radius:6px;font:12px/1.4 monospace;white-space:pre-wrap'; document.body.appendChild(b); } b.textContent += 'Erro: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'desconhecido') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '') + '\n'; }, true);
</script>
<div id="app"><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ece9ec;color:#5e3a91;font:500 13px monospace;letter-spacing:.14em;text-transform:uppercase">Dani's Portfolio · carregando…</div></div>
<template id="tpl">
<main class="lk-main" style="position: relative; width: 100%; height: 100vh; min-height: 560px; overflow: hidden; background: #ece9ec; font-family: 'DM Sans', sans-serif; color: #302936">
  <canvas data-locker="1" ref="{{canvasRef}}" role="img" aria-label="Corredor com armários escolares de inox; o armário central é lilás com estrelas amarelas e está trancado com um cadeado de segredo." style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none"></canvas>

  <!-- carregando / sem WebGL -->
  <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #ece9ec">
      <p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #5e3a91">Dani's Portfolio</p>
      <p style="margin: 0; font-size: 16px; color: #302936">{{loadingText}}</p>
    </div>
  </sc-if>

  <!-- cabeçalho -->
  <header style="position: absolute; left: 0; right: 0; top: 0; z-index: 40; height: 45px; padding: 0 16px 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none">
    <button class="ui navb" onClick="{{openAbout}}" aria-label="Sobre Daniele Oliveira" style="height: 44px; padding: 0 6px; border: 0; border-radius: 4px; background: transparent; cursor: pointer; display: flex; align-items: center">
      <img src="68608591e07da4050de9be01f4ba5a1c.png" alt="" style="height: 30px; display: block;">
    </button>
    <nav aria-label="Portfólio" class="ui" style="display: flex; gap: 2px; align-items: center">
      <button class="navb" onClick="{{openProjects}}" style="height: 44px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #302936; font: 500 14px 'DM Sans', sans-serif; cursor: pointer">Projetos</button>
      <button class="navb" onClick="{{openAbout}}" style="height: 44px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #302936; font: 500 14px 'DM Sans', sans-serif; cursor: pointer">Sobre</button>
      <button class="navb" onClick="{{openContact}}" style="height: 44px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #302936; font: 500 14px 'DM Sans', sans-serif; cursor: pointer">Contato</button>
      <button class="navb" onClick="{{restart}}" aria-label="Reiniciar experiência" title="Reiniciar" style="width: 44px; height: 44px; border: 0; border-radius: 4px; background: transparent; color: #302936; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      </button>
    </nav>
  </header>

  <!-- atalhos de teclado para os objetos 3D (aparecem ao receber foco) -->
  <nav class="sr" aria-label="Objetos interativos do armário">
    <sc-for list="{{objectButtons}}" as="o" hint-placeholder-count="4">
      <button onClick="{{o.run}}" style="height: 36px; padding: 0 10px; border: 1px solid #302936; border-radius: 4px; background: #fff; font: 500 13px 'DM Sans', sans-serif; color: #302936; cursor: pointer">{{o.label}}</button>
    </sc-for>
  </nav>

  <!-- título inicial -->
  <sc-if value="{{showTitle}}" hint-placeholder-val="{{ true }}">
    <div class="fade" style="position: absolute; left: 16px; right: 16px; top: 72px; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; text-align: center">
      <p style="margin: 0; padding: 2px 8px; background: rgba(236,233,236,.8); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #5e3a91">Personal archive · Est. 2026</p>
      <h1 class="title-xl" style="margin: 0; font-size: 76px; line-height: 1; letter-spacing: -.035em; font-weight: 800; color: #1e1b22; text-shadow: 0 1px 18px rgba(236,233,236,.9)">Unlock my <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: 0; color: #7b4bb0">mind.</span></h1>
    </div>
  </sc-if>

  <!-- instruções + controles contextuais -->
  <div class="lk-bottom" style="position: absolute; left: 16px; right: 16px; bottom: 18px; z-index: 30; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none">
    <p aria-live="polite" style="margin: 0; padding: 6px 12px; max-width: 560px; border-radius: 4px; background: rgba(244,244,242,.9); font-family: 'DM Mono', monospace; font-size: 12.5px; line-height: 1.45; color: #1e1b22; text-align: center">{{hint}}</p>
    <sc-if value="{{showGesture}}" hint-placeholder-val="{{ true }}">
      <p class="hide-sm" style="margin: -4px 0 0; padding: 3px 10px; border-radius: 4px; background: rgba(244,244,242,.75); font-family: 'DM Mono', monospace; font-size: 11px; color: #4a4152">Roda do mouse ou pinça para aproximar · arraste para mover</p>
    </sc-if>

    <!-- discos do cadeado -->
    <sc-if value="{{showDials}}" hint-placeholder-val="{{ false }}">
      <div class="ui fade" role="group" aria-label="Segredo do cadeado" style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #f4f1e8; border-radius: 6px; box-shadow: 0 8px 22px rgba(0,0,0,.14)">
        <sc-for list="{{dials}}" as="d" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; align-items: center; width: 44px">
            <button class="icon" onClick="{{d.up}}" aria-label="Aumentar disco {{d.n}}" style="width: 44px; height: 36px; border: 0; border-radius: 4px; background: transparent; cursor: pointer; color: #302936; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>
            </button>
            <output aria-label="Disco {{d.n}}" style="font-family: 'DM Mono', monospace; font-size: 22px; font-variant-numeric: tabular-nums">{{d.value}}</output>
            <button class="icon" onClick="{{d.down}}" aria-label="Diminuir disco {{d.n}}" style="width: 44px; height: 36px; border: 0; border-radius: 4px; background: transparent; cursor: pointer; color: #302936; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
          </div>
        </sc-for>
        <button class="btn" onClick="{{backFromLock}}" style="margin-left: 6px; height: 40px; padding: 0 12px; border: 1px solid #302936; border-radius: 4px; background: transparent; font: 500 13px 'DM Sans', sans-serif; color: #302936; cursor: pointer">Afastar</button>
      </div>
    </sc-if>

    <!-- ações -->
    <div class="ui" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
      <sc-if value="{{showStart}}" hint-placeholder-val="{{ true }}">
        <button class="btn" onClick="{{focusLock}}" style="height: 44px; padding: 0 18px; border: 1.5px solid #1e1b22; border-radius: 4px; background: #f4f4f2; font: 500 14px 'DM Sans', sans-serif; color: #1e1b22; cursor: pointer; display: flex; align-items: center; gap: 8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          Abrir cadeado
        </button>
      </sc-if>
      <sc-if value="{{showDoorBtn}}" hint-placeholder-val="{{ false }}">
        <button class="btn" onClick="{{toggleDoor}}" style="height: 44px; padding: 0 18px; border: 1.5px solid #1e1b22; border-radius: 4px; background: #f4f4f2; font: 500 14px 'DM Sans', sans-serif; color: #1e1b22; cursor: pointer">{{doorLabel}}</button>
      </sc-if>
      <sc-if value="{{showLightBtn}}" hint-placeholder-val="{{ false }}">
        <button class="btn" onClick="{{toggleLight}}" aria-pressed="{{lit}}" style="height: 44px; padding: 0 16px; border: 1.5px solid #1e1b22; border-radius: 4px; background: #f4f4f2; font: 500 14px 'DM Sans', sans-serif; color: #1e1b22; cursor: pointer; display: flex; align-items: center; gap: 8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>
          {{lightLabel}}
        </button>
      </sc-if>
      <sc-if value="{{showFolderBar}}" hint-placeholder-val="{{ false }}">
        <div class="fade" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; padding: 6px; background: #f4f1e8; border-radius: 6px; box-shadow: 0 8px 22px rgba(0,0,0,.14)">
          <span style="padding: 0 8px; font-family: 'DM Mono', monospace; font-size: 12px; color: #5e3a91">Pasta {{folderNum}} · {{folderTitle}}</span>
          <button class="icon" onClick="{{prevPage}}" aria-label="Folha anterior" style="width: 40px; height: 40px; border: 1px solid #302936; border-radius: 4px; background: transparent; cursor: pointer; color: #302936">‹</button>
          <span style="font-family: 'DM Mono', monospace; font-size: 12px; min-width: 44px; text-align: center">{{pageLabel}}</span>
          <button class="icon" onClick="{{nextPage}}" aria-label="Próxima folha" style="width: 40px; height: 40px; border: 1px solid #302936; border-radius: 4px; background: transparent; cursor: pointer; color: #302936">›</button>
          <sc-if value="{{folderUrl}}" hint-placeholder-val="{{ true }}"><a href="{{folderUrl}}" target="_blank" rel="noreferrer" style="display: inline-flex; align-items: center; height: 40px; padding: 0 10px; font-size: 13px; font-weight: 500">Behance ↗</a></sc-if>
          <button class="btn" onClick="{{closeFolder}}" style="height: 40px; padding: 0 12px; border: 1px solid #302936; border-radius: 4px; background: transparent; font: 500 13px 'DM Sans', sans-serif; color: #302936; cursor: pointer">Fechar pasta ✕</button>
        </div>
      </sc-if>
    </div>
  </div>

  <!-- zoom manual -->
  <div class="ui lk-zoom" role="group" aria-label="Aproximação da câmera" style="position: absolute; right: 16px; bottom: 18px; z-index: 35; display: flex; gap: 6px">
    <button class="icon hide-sm" onClick="{{zoomOut}}" disabled="{{zoomOutOff}}" aria-label="Afastar" title="Afastar" style="width: 44px; height: 44px; border: 0; border-radius: 4px; background: rgba(244,241,232,.92); cursor: pointer; color: #302936; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.08)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
    </button>
    <button class="icon hide-sm" onClick="{{zoomIn}}" disabled="{{zoomInOff}}" aria-label="Aproximar" title="Aproximar" style="width: 44px; height: 44px; border: 0; border-radius: 4px; background: rgba(244,241,232,.92); cursor: pointer; color: #302936; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.08)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg>
    </button>
    <button class="icon" onClick="{{resetView}}" disabled="{{resetOff}}" aria-label="Restaurar enquadramento" title="Restaurar enquadramento" style="width: 44px; height: 44px; border: 0; border-radius: 4px; background: rgba(244,241,232,.92); cursor: pointer; color: #302936; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.08)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9V5a2 2 0 0 1 2-2h4M15 3h4a2 2 0 0 1 2 2v4M21 15v4a2 2 0 0 1-2 2h-4M9 21H5a2 2 0 0 1-2-2v-4"></path></svg>
    </button>
  </div>

  <!-- painéis -->
  <sc-if value="{{hasModal}}" hint-placeholder-val="{{ false }}">
    <div class="fade" onClick="{{closeModal}}" style="position: absolute; inset: 0; z-index: 60; background: rgba(28,23,34,.55); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box">
      <section role="dialog" aria-modal="true" aria-label="{{modalTitle}}" onClick="{{stop}}" style="position: relative; width: 100%; max-width: 760px; max-height: 88vh; overflow-y: auto; background: #f4f1e8; border-radius: 4px; padding: 32px 28px 32px; box-sizing: border-box; box-shadow: 0 30px 60px rgba(0,0,0,.4)">
        <button onClick="{{closeModal}}" aria-label="Fechar" style="position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; color: #302936; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>

        <sc-if value="{{showProjects}}" hint-placeholder-val="{{ false }}">
          <h2 style="margin: 0 0 6px; font-size: 32px; font-weight: 800; letter-spacing: -.02em">Projetos</h2>
          <p style="margin: 0 0 20px; font-size: 14px; color: #4a4152">{{projectsNote}}</p>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px">
            <sc-for list="{{projectList}}" as="p" hint-placeholder-count="9">
              <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 4px; background: #fff; border-top: 8px solid {{p.color}}">
                <sc-if value="{{p.coverImg}}" hint-placeholder-val="{{ true }}">
                  <button onClick="{{p.open}}" aria-label="Abrir pasta {{p.num}}" style="display: block; padding: 0; margin: 0 0 6px; border: 0; background: #ece9ec; cursor: pointer; border-radius: 2px; overflow: hidden; aspect-ratio: 4 / 3; width: 100%">
                    <img src="{{p.coverImg}}" alt="Capa do projeto {{p.short}}" loading="lazy" style="display: block; width: 100%; height: 100%; object-fit: cover">
                  </button>
                </sc-if>
                <span style="font-family: 'DM Mono', monospace; font-size: 11px; color: #5e3a91">Pasta {{p.num}} · {{p.tag}}</span>
                <span style="font-size: 14px; font-weight: 700; line-height: 1.3">{{p.title}}</span>
                <div style="display: flex; gap: 10px; align-items: center; margin-top: 4px">
                  <button class="btn" onClick="{{p.open}}" style="height: 36px; padding: 0 10px; border: 1px solid #302936; border-radius: 4px; background: transparent; font: 500 12px 'DM Sans', sans-serif; color: #302936; cursor: pointer">Abrir pasta</button>
                  <sc-if value="{{p.url}}" hint-placeholder-val="{{ true }}"><a href="{{p.url}}" target="_blank" rel="noreferrer" style="font-size: 12px; font-weight: 500">Behance ↗</a></sc-if>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{showContact}}" hint-placeholder-val="{{ false }}">
          <h2 style="margin: 0 0 8px; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 46px; line-height: 1">Vamos criar algo juntos?</h2>
          <p style="margin: 0 0 22px; font-size: 15px; color: #4a4152">Daniele Oliveira · Designer gráfico · Belo Horizonte, MG</p>
          <div style="display: flex; flex-direction: column; gap: 10px"><a href="mailto:danioliveira13@hotmail.com.br" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0px 16px; border: 1.5px solid rgb(48, 41, 54); border-radius: 4px; text-decoration: none; color: rgb(48, 41, 54); font-weight: 500; word-break: break-all"><span>daniolvra.design@outlook.com&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ✉</span></a>
            <a href="https://wa.me/5531993755819" target="_blank" rel="noreferrer" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0px 16px; border: 1.5px solid rgb(48, 41, 54); border-radius: 4px; text-decoration: none; color: rgb(48, 41, 54); font-weight: 500">WhatsApp<span>↗</span></a>
            <a href="https://www.linkedin.com/in/daniolvra/" target="_blank" rel="noreferrer" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0px 16px; border: 1.5px solid rgb(48, 41, 54); border-radius: 4px; text-decoration: none; color: rgb(48, 41, 54); font-weight: 500">LinkedIn <span>↗</span></a>
            <a href="https://www.behance.net/daniolvra" target="_blank" rel="noreferrer" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0px 16px; border: 1.5px solid rgb(48, 41, 54); border-radius: 4px; text-decoration: none; color: rgb(48, 41, 54); font-weight: 500">Behance <span>↗</span></a>
            <a href="https://instagram.com/daniolvra" target="_blank" rel="noreferrer" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0px 16px; border: 1.5px solid rgb(48, 41, 54); border-radius: 4px; text-decoration: none; color: rgb(48, 41, 54); font-weight: 500">@daniolvra <span>↗</span></a>
          </div>
        </sc-if>

        <sc-if value="{{showCamera}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0 0 6px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #5e3a91">Objeto pessoal</p>
          <h2 style="margin: 0 0 14px; font-size: 32px; font-weight: 800; letter-spacing: -.02em">Olympus Infinity Zoom 70</h2>
          <p style="margin: 0 0 18px; font-size: 15px; line-height: 1.6; color: #4a4152">Câmera analógica 35 mm · lente zoom 38–70 mm · tampa frontal deslizante.</p>
          <a href="https://retrospekt.com/products/olympus-infinity-zoom-70-35mm-compact-film-camera" target="_blank" rel="noreferrer" style="font-weight: 500">Referência do modelo ↗</a>
        </sc-if>

        <sc-if value="{{showNotebook}}" hint-placeholder-val="{{ false }}">
          <h2 style="margin: 0 0 8px; font-size: 32px; font-weight: 800; letter-spacing: -.02em">Processo criativo</h2>
